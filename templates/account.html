<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otlobly — حسابي · My account</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#111111">
<style>
  :root{--bg:#f7f5ef;--ink:#15140f;--muted:#7a766c;--line:#e8e4d8;--accent:#ff5a1f;--card:#fff;
        --good:#16a34a;--transit:#2563eb;--customs:#d97706;--cleared:#16a34a;--delivered:#16a34a;--arrived:#7c3aed}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;justify-content:center;padding:22px 14px 60px}
  .card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 10px 40px rgba(20,18,12,.06);padding:22px 20px}
  .brand{display:flex;align-items:center;gap:10px;justify-content:flex-end}
  .brand h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.4px}
  .brand .ly{color:var(--accent)}
  .lang{margin-inline-end:auto;display:flex;gap:6px}
  .lang span{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);
    border-radius:20px;padding:3px 11px}
  .lang span.on{background:#111;color:#fff;border-color:#111}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 16px;text-align:start}
  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;text-align:start}
  input{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
    background:#fbfaf6;text-align:center;letter-spacing:1px}
  input:focus{outline:none;border-color:var(--accent);background:#fff}
  button{width:100%;margin-top:14px;font-size:15px;font-weight:800;color:#fff;background:var(--accent);
    border:0;border-radius:12px;padding:14px;cursor:pointer}
  button:disabled{opacity:.6}
  .ghost{background:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px;margin-top:6px}
  .hint{color:var(--muted);font-size:11.5px;text-align:center;margin-top:8px}
  .err{background:#fef2f2;border:1px solid #f3c9c9;color:#b42318;border-radius:10px;padding:10px 12px;
    font-size:13px;margin-top:12px;text-align:center}
  .dev{background:#fffbe6;border:1px dashed #e6c200;border-radius:10px;padding:8px 12px;font-size:12px;
    margin-top:10px;text-align:center;color:#8a6d00}
  .hello{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .hello b{font-size:18px}
  .out{cursor:pointer;color:var(--muted);font-size:12px;border:1px solid var(--line);
    border-radius:20px;padding:4px 11px;background:none;width:auto;margin:0;font-weight:600}
  h2.sec{font-size:14px;font-weight:800;margin:20px 0 10px;text-align:start}
  .ship{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px;background:#fbfaf6}
  .now{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .now .dot{width:13px;height:13px;border-radius:50%;flex:none;background:var(--transit)}
  .now .big{font-weight:800;font-size:16px}
  .now small{color:var(--muted);font-size:11px;display:block}
  .b-transit .dot,.b-transit.dotc{background:var(--transit)}
  .b-customs .dot,.b-customs.dotc{background:var(--customs)}
  .b-cleared .dot,.b-cleared.dotc{background:var(--cleared)}
  .b-arrived .dot,.b-arrived.dotc{background:var(--arrived)}
  .b-delivered .dot,.b-delivered.dotc{background:var(--delivered)}
  .items{display:flex;flex-direction:column;gap:7px;margin:8px 0 2px}
  .prod{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .prod img,.prod .ph{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#f0ede4;
    border:1px solid var(--line);flex:none}
  .tnum{color:var(--muted);font-size:11.5px;text-align:start;margin-top:6px}
  .eta{margin-top:8px;background:#ecfdf3;border:1px solid #bbf7d0;color:#15803d;border-radius:9px;
    padding:7px 10px;font-size:12.5px}
  .tl{list-style:none;margin:11px 0 0;padding:0}
  .tl li{position:relative;padding:0 0 14px 18px;margin:0}
  .tl li::before{content:"";position:absolute;inset-inline-start:4px;top:14px;bottom:-2px;width:2px;background:var(--line)}
  .tl li:last-child::before{display:none}
  .tl .dot{position:absolute;inset-inline-start:0;top:3px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .tl .lab{font-weight:650;font-size:12.5px}
  .tl .when{color:var(--muted);font-size:11px}
  .ord{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
    padding:9px 11px;margin-bottom:8px;background:#fff}
  .ord .thumb{width:42px;height:42px;border-radius:8px;object-fit:contain;background:#f0ede4;border:1px solid var(--line);flex:none}
  .ord .t{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.3;max-height:2.6em;overflow:hidden}
  .pill{font-size:10.5px;font-weight:800;border-radius:20px;padding:3px 9px;white-space:nowrap}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px}
  .foot{margin-top:18px;color:var(--muted);font-size:11.5px;text-align:center}
  [dir=rtl] .tl li{padding:0 18px 14px 0}
</style>
<div class="card">
  <div class="brand">
    <span class="lang"><span id="l_ar" onclick="setLang('ar')">عربي</span><span id="l_en" onclick="setLang('en')">EN</span></span>
    <h1>Otlob<span class="ly">ly</span></h1>
    <svg width="34" height="34" viewBox="0 0 100 100"><rect width="100" height="100" rx="26" fill="#111"/>
      <circle cx="46" cy="52" r="20" fill="none" stroke="#fff" stroke-width="9"/>
      <circle cx="46" cy="52" r="6" fill="#fff"/><circle cx="72" cy="30" r="9" fill="#ff5a1f"/></svg>
  </div>

  <!-- STATE 1: enter phone. Primary = receive-a-code OTP (business is Meta-verified now);
       WhatsApp-tap stays as the no-cost fallback, email third. -->
  <div id="s_phone" style="display:none">
    <p class="sub" id="t_introphone"></p>
    <label id="t_phonelbl"></label>
    <input id="phone" type="tel" inputmode="tel" placeholder="05xxxxxxxx"
           onkeydown="if(event.key==='Enter')sendCode()">
    <button id="b_send" onclick="sendCode()"></button>
    <div class="hint" id="t_phonehint"></div>
    <div id="out1"></div>
    <div style="display:flex;align-items:center;gap:10px;color:#9aa3af;font-size:12px;margin:16px 0 2px">
      <span style="flex:1;height:1px;background:#e5e7eb"></span>أو · or<span style="flex:1;height:1px;background:#e5e7eb"></span></div>
    <button id="b_wa" onclick="waLogin()"
            style="width:100%;background:#25D366;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px">
      🟢 تسجيل الدخول عبر واتساب · Log in with WhatsApp</button>
    <div id="waStatus" style="margin-top:10px"></div>
    <div style="display:flex;align-items:center;gap:10px;color:#9aa3af;font-size:12px;margin:16px 0 2px">
      <span style="flex:1;height:1px;background:#e5e7eb"></span>أو · or<span style="flex:1;height:1px;background:#e5e7eb"></span></div>
    <button class="ghost" id="b_email" onclick="emailOpen()"
            style="border:1px solid var(--line);border-radius:12px;width:100%;padding:12px;font-size:14px"></button>
  </div>

  <!-- STATE 2: enter code -->
  <div id="s_code" style="display:none">
    <p class="sub" id="t_introcode"></p>
    <label id="t_codelbl"></label>
    <input id="code" type="tel" inputmode="numeric" maxlength="6" placeholder="● ● ● ● ● ●"
           onkeydown="if(event.key==='Enter')verifyCode()">
    <button id="b_verify" onclick="verifyCode()"></button>
    <button class="ghost" id="b_resend" onclick="backToPhone()"></button>
    <div id="out2"></div>
  </div>

  <!-- STATE 2b: email login (second method — WhatsApp above stays the main door) -->
  <div id="s_email" style="display:none">
    <p class="sub" id="t_introemail"></p>
    <label id="t_emaillbl"></label>
    <input id="lemail" type="email" inputmode="email" placeholder="name@example.com"
           style="letter-spacing:0" onkeydown="if(event.key==='Enter')emailGo()">
    <div id="ecodeBox" style="display:none">
      <label id="t_ecodelbl"></label>
      <input id="ecode" type="tel" inputmode="numeric" maxlength="6" placeholder="● ● ● ● ● ●"
             onkeydown="if(event.key==='Enter')emailGo()">
    </div>
    <button id="b_esend" onclick="emailGo()"></button>
    <button class="ghost" id="b_eback" onclick="emailBack()"></button>
    <div id="out3"></div>
  </div>

  <!-- STATE 3: dashboard -->
  <div id="s_dash" style="display:none">
    <div class="hello"><b id="t_hello"></b></div>
    <div id="emailLine" class="hint" style="text-align:start;margin:-2px 0 10px"></div>
    <div id="emailMgr" style="display:none;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;background:#fbfaf6">
      <input id="memail" type="email" inputmode="email" placeholder="name@example.com" style="letter-spacing:0">
      <div id="mcodeBox" style="display:none">
        <input id="mcode" type="tel" inputmode="numeric" maxlength="6" placeholder="● ● ● ● ● ●" style="margin-top:8px">
      </div>
      <button id="b_mgo" onclick="linkGo()" style="margin-top:10px;padding:11px"></button>
      <div id="out4"></div>
    </div>
    <div id="balSum"></div>
    <h2 class="sec" id="t_deliveries"></h2>
    <div id="shipments"></div>
    <h2 class="sec" id="t_orders"></h2>
    <div id="orders"></div>
    <h2 class="sec" id="t_payments" style="display:none"></h2>
    <div id="payments"></div>
    <div style="text-align:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      <button class="out" id="b_logout" onclick="logout()" style="padding:8px 26px;font-size:13px"></button></div>
  </div>

  <div class="foot" id="t_foot"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let LANG="ar", PHONE="", LEMAIL="", ECODE=false, MCODE=false;
const T={
  ar:{introphone:"سجّل الدخول لمتابعة شحناتك وطلباتك.", phonelbl:"رقم الجوال", send:"إرسال رمز الدخول",
      phonehint:"سنرسل رمزاً إلى رقمك على واتساب.",
      introcode:"أدخل الرمز المكوّن من 6 أرقام المُرسل إلى واتساب.", codelbl:"رمز الدخول",
      verify:"دخول", resend:"تغيير الرقم", hello:"مرحباً", logout:"خروج",
      deliveries:"📦 شحناتك", orders:"🧾 كل طلباتك", noship:"لا توجد شحنات بعد.", noord:"لا توجد طلبات بعد.",
      curr:"الحالة الحالية", track:"رقم التتبّع", eta:"🚚 الوصول المتوقّع", prep:"نقوم بتجهيز طلبك",
      deposit:"دفعت", remaining:"المتبقّي", paidsum:"إجمالي ما دفعته", remainsum:"المتبقّي عليك", asof:"🕓 آخر تحديث",
      creditsum:"رصيدك لدينا", payments:"💵 سجل دفعاتك", credittag:"رصيد لحسابك",
      kdeposit:"عربون", kcollect:"دفعة", krefund:"استرجاع",
      emailbtn:"✉️ الدخول بالبريد الإلكتروني", introemail:"أدخل بريدك الإلكتروني المربوط بحسابك وسنرسل لك رمز الدخول.",
      emaillbl:"البريد الإلكتروني", ecodelbl:"رمز الدخول (من بريدك)", esend:"إرسال الرمز", everify:"دخول",
      eback:"رجوع", esent:"إذا كان بريدك مربوطاً بحساب، وصلك رمز الآن.", enolink:"البريد الإلكتروني: غير مربوط",
      elink:"ربط بريد", echange:"تغيير", elinked:"تم ربط بريدك ✓",
      foot:"Otlobly · لأي استفسار تواصل معنا", sending:"…", verifying:"…"},
  en:{introphone:"Sign in to follow your shipments and orders.", phonelbl:"Mobile number", send:"Send login code",
      phonehint:"We'll send a code to your number on WhatsApp.",
      introcode:"Enter the 6-digit code sent to your WhatsApp.", codelbl:"Login code",
      verify:"Sign in", resend:"Change number", hello:"Hi", logout:"Log out",
      deliveries:"📦 Your shipments", orders:"🧾 All your orders", noship:"No shipments yet.", noord:"No orders yet.",
      curr:"current status", track:"Tracking #", eta:"🚚 Expected arrival", prep:"We're preparing your order",
      deposit:"Deposited", remaining:"Remaining", paidsum:"Total you've paid", remainsum:"Remaining balance", asof:"🕓 last updated",
      creditsum:"Your credit", payments:"💵 Your payments", credittag:"Account credit",
      kdeposit:"Deposit", kcollect:"Payment", krefund:"Refund",
      emailbtn:"✉️ Sign in with email", introemail:"Enter the email linked to your account and we'll send a login code.",
      emaillbl:"Email", ecodelbl:"Login code (from your email)", esend:"Send code", everify:"Sign in",
      eback:"Back", esent:"If this email is linked to an account, a code is on its way.", enolink:"Email: not linked",
      elink:"Link email", echange:"Change", elinked:"Email linked ✓",
      foot:"Otlobly · contact us anytime", sending:"…", verifying:"…"}
};
const STAT={ // order status → {ar,en,color,bg} — customer-friendly labels ONLY
  REQUESTED:{ar:"قيد المراجعة",en:"Reviewing",c:"#92400e",b:"#fef3c7"},
  QUOTED:{ar:"بانتظار التأكيد",en:"Awaiting confirm",c:"#92400e",b:"#fef3c7"},
  PAID:{ar:"مدفوع",en:"Paid",c:"#3730a3",b:"#e0e7ff"},
  IN_CART:{ar:"قيد التجهيز",en:"Being prepared",c:"#92400e",b:"#fef3c7"},   // internal cart staging — customers just see "preparing"
  ORDERED:{ar:"تم الطلب",en:"Ordered",c:"#3730a3",b:"#e0e7ff"},
  SHIPPED:{ar:"تم الشحن",en:"Shipped",c:"#1d4ed8",b:"#dbeafe"},
  ARRIVED:{ar:"وصلت بلدك",en:"Arrived",c:"#6d28d9",b:"#ede9fe"},
  DELIVERED:{ar:"تم التسليم",en:"Delivered",c:"#15803d",b:"#dcfce7"},
  COLLECTED:{ar:"مكتمل",en:"Completed",c:"#15803d",b:"#dcfce7"},
  CANCELLED:{ar:"ملغى",en:"Cancelled",c:"#b42318",b:"#fee2e2"}
};
function t(k){return (T[LANG]||T.en)[k];}
function money(n){return (n==null)?"—":("$"+Number(n).toFixed(2));}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(d){ if(!d)return""; const x=new Date(d); if(isNaN(x))return esc(d);
  return x.toLocaleDateString(LANG==="ar"?"ar":"en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtRange(a,b){ const loc=LANG==="ar"?"ar":"en-GB";
  const f=d=>new Date(d).toLocaleDateString(loc,{day:"2-digit",month:"short"});
  return f(a)+" – "+f(b)+" "+new Date(b).getFullYear(); }
function setLang(l){ LANG=l; document.body.dir=l==="ar"?"rtl":"ltr";
  $("l_ar").classList.toggle("on",l==="ar"); $("l_en").classList.toggle("on",l==="en"); paint(); }
function paint(){
  ["introphone","phonelbl","phonehint","introcode","codelbl","deliveries","orders","payments","introemail","emaillbl","ecodelbl"].forEach(k=>{const e=$("t_"+k);if(e)e.textContent=t(k);});
  $("b_send").textContent=t("send"); $("b_verify").textContent=t("verify"); $("b_resend").textContent=t("resend");
  $("b_logout").textContent=t("logout"); $("t_foot").textContent=t("foot");
  $("b_email").textContent=t("emailbtn"); $("b_eback").textContent=t("eback");
  $("b_esend").textContent=ECODE?t("everify"):t("esend");
  $("b_mgo").textContent=MCODE?t("everify"):t("esend");
}
function show(state){ ["s_phone","s_code","s_email","s_dash"].forEach(s=>$(s).style.display=s===state?"block":"none"); }
async function sendCode(){
  const p=$("phone").value.trim(); if(!p)return; PHONE=p;
  const b=$("b_send"); b.disabled=true; const o=b.textContent; b.textContent=t("sending"); $("out1").innerHTML="";
  let d; try{ d=await (await fetch("/api/customer/otp/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:p})})).json(); }catch(e){ d={error:"network"}; }
  b.disabled=false; b.textContent=o;
  if(!d.ok){ $("out1").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  paint(); show("s_code"); $("code").focus();
  if(d.dev_code){ $("out2").innerHTML=`<div class="dev">رمز تجريبي (dev): <b>${d.dev_code}</b></div>`; $("code").value=d.dev_code; }
}
let WA_POLL=null;
async function waLogin(){
  const b=$("b_wa"); b.disabled=true; b.style.opacity=".6";
  let d; try{ d=await (await fetch("/api/customer/wa_login/start",{method:"POST"})).json(); }catch(e){ d={}; }
  if(!d.ok){ b.disabled=false; b.style.opacity="1";
    $("waStatus").innerHTML=`<div class="err">${esc(d.error)||'WhatsApp login unavailable'}</div>`; return; }
  window.open(d.wa_url,"_blank");                      // opens WhatsApp with the code pre-filled
  $("waStatus").innerHTML=`<div class="hint" style="line-height:1.7">📲 <b>أرسل الرسالة</b> التي فتحت في واتساب — سيتم تسجيل دخولك تلقائياً.<br>
    Hit <b>send</b> in WhatsApp — you'll be logged in automatically.</div>
    <div class="hint">⏳ بانتظار رسالتك · waiting for your message…</div>`;
  clearInterval(WA_POLL); WA_POLL=setInterval(waPoll,3000); setTimeout(waPoll,1200);
}
async function waPoll(){
  let d; try{ d=await (await fetch("/api/customer/wa_login/poll")).json(); }catch(e){ return; }
  if(d.status==="ok"){ clearInterval(WA_POLL); loadDashboard(); }
  else if(d.status==="unknown"){ clearInterval(WA_POLL); const b=$("b_wa"); b.disabled=false; b.style.opacity="1";
    $("waStatus").innerHTML=`<div class="err">${esc(d.error)}</div>`; }
  else if(d.status==="expired"||d.status==="none"){ clearInterval(WA_POLL); const b=$("b_wa"); b.disabled=false; b.style.opacity="1";
    $("waStatus").innerHTML=`<div class="hint">انتهت المهلة — اضغط الزر لتجربة أخرى · timed out, tap again</div>`; }
  // pending → keep polling
}
function backToPhone(){ show("s_phone"); $("out2").innerHTML=""; clearInterval(WA_POLL); $("phone").focus(); }
async function verifyCode(){
  const c=($("code").value||"").trim(); if(!c)return;
  const b=$("b_verify"); b.disabled=true; const o=b.textContent; b.textContent=t("verifying"); $("out2").innerHTML="";
  let d; try{ d=await (await fetch("/api/customer/otp/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:PHONE,code:c})})).json(); }catch(e){ d={error:"network"}; }
  b.disabled=false; b.textContent=o;
  if(!d.ok){ $("out2").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  loadDashboard();
}
async function logout(){ try{ await fetch("/api/customer/logout",{method:"POST"}); }catch(e){} backToPhone(); show("s_phone"); }
/* ---- email login (second method) + link/change from the dashboard ---- */
async function post(url,body){ try{ return await (await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})).json(); }catch(e){ return {error:"network"}; } }
function emailOpen(){ ECODE=false; $("ecodeBox").style.display="none"; $("out3").innerHTML=""; paint(); show("s_email"); $("lemail").focus(); }
function emailBack(){ if(ECODE){ ECODE=false; $("ecodeBox").style.display="none"; $("out3").innerHTML=""; paint(); $("lemail").focus(); } else { show("s_phone"); } }
function emailGo(){ ECODE?emailVerify():emailStart(); }
async function emailStart(){
  const em=($("lemail").value||"").trim(); if(!em)return; LEMAIL=em;
  const b=$("b_esend"); b.disabled=true; const d=await post("/api/customer/email/login/start",{email:em}); b.disabled=false;
  if(!d.ok){ $("out3").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  ECODE=true; $("ecodeBox").style.display="block"; paint(); $("ecode").focus();
  $("out3").innerHTML=`<div class="hint">${t("esent")}</div>`;
  if(d.dev_code){ $("out3").innerHTML+=`<div class="dev">رمز تجريبي (dev): <b>${d.dev_code}</b></div>`; $("ecode").value=d.dev_code; }
}
async function emailVerify(){
  const c=($("ecode").value||"").trim(); if(!c)return;
  const b=$("b_esend"); b.disabled=true; const d=await post("/api/customer/email/login/verify",{email:LEMAIL,code:c}); b.disabled=false;
  if(!d.ok){ $("out3").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  ECODE=false; loadDashboard();
}
async function refreshEmailLine(){
  let me; try{ me=await (await fetch("/api/customer/me")).json(); }catch(e){ me={}; }
  const st=me.email_masked?`${esc(me.email_masked)} ${me.email_verified?"✓":""}`:t("enolink");
  $("emailLine").innerHTML=`✉️ ${st} <a href="#" onclick="toggleEmailMgr();return false" style="color:var(--accent);font-weight:700;text-decoration:none">${me.email_masked?t("echange"):t("elink")}</a>`;
}
function toggleEmailMgr(){
  const m=$("emailMgr"); const open=m.style.display!=="none";
  m.style.display=open?"none":"block";
  if(!open){ MCODE=false; $("mcodeBox").style.display="none"; $("out4").innerHTML=""; paint(); $("memail").focus(); }
}
function linkGo(){ MCODE?linkVerify():linkStart(); }
async function linkStart(){
  const em=($("memail").value||"").trim(); if(!em)return;
  const b=$("b_mgo"); b.disabled=true; const d=await post("/api/customer/email/link/start",{email:em}); b.disabled=false;
  if(!d.ok){ $("out4").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  MCODE=true; $("mcodeBox").style.display="block"; paint(); $("mcode").focus();
  $("out4").innerHTML=`<div class="hint">${t("esent")}</div>`;
  if(d.dev_code){ $("out4").innerHTML+=`<div class="dev">رمز تجريبي (dev): <b>${d.dev_code}</b></div>`; $("mcode").value=d.dev_code; }
}
async function linkVerify(){
  const c=($("mcode").value||"").trim(); if(!c)return;
  const b=$("b_mgo"); b.disabled=true; const d=await post("/api/customer/email/link/verify",{code:c}); b.disabled=false;
  if(!d.ok){ $("out4").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  MCODE=false; $("emailMgr").style.display="none"; $("out4").innerHTML="";
  refreshEmailLine();
}
function shipCard(s){
  const cur=s.current||{}; const bucket=cur.bucket||"transit";
  const items=(s.items||[]).map(it=>`<div class="prod">${it.image?`<img src="${esc(it.image)}" loading="lazy" alt="">`:'<div class="ph"></div>'}<span dir="auto">${esc(it.title)}</span></div>`).join("");
  const tnum=s.tracking?`<div class="tnum">${t("track")} · ${esc(s.tracking)}</div>`:"";
  const eta=(s.est_from&&s.est_to)?`<div class="eta">${t("eta")}: <b>${fmtRange(s.est_from,s.est_to)}</b></div>`
    :(s.est_delivery?`<div class="eta">${t("eta")}: <b>${fmt(s.est_delivery)}</b></div>`:"");
  const evs=(s.events||[]).slice().reverse();
  const tl=evs.length?`<ul class="tl">${evs.map((e,i)=>`<li class="b-${e.bucket||'transit'}"><span class="dot dotc b-${e.bucket||'transit'}"></span><div class="lab" dir="auto">${esc(e.label)}</div><div class="when">${fmt(e.date)}</div></li>`).join("")}</ul>`:"";
  const asof=(s.stale&&s.as_of)?`<div class="hint">${t("asof")} ${fmt(s.as_of)}</div>`:"";
  return `<div class="ship">
    <div class="now b-${bucket}"><span class="dot"></span><div><div class="big" dir="auto">${esc(cur.label)||t("prep")}</div><small>${t("curr")}</small></div></div>
    ${asof}${items?`<div class="items">${items}</div>`:""}${tnum}${eta}${tl}</div>`;
}
function orderRow(o){
  // Unknown/internal statuses must NEVER leak raw to the customer — generic "preparing".
  const st=STAT[o.status]||{ar:"قيد التجهيز",en:"In progress",c:"#92400e",b:"#fef3c7"};
  const it=(o.items||[])[0]||{};
  const more=(o.items||[]).length>1?` +${o.items.length-1}`:"";
  const eta=o.est_delivery?` · ${t("eta").replace('🚚 ','')} ${fmt(o.est_delivery)}`:"";
  const done=(o.status==="COLLECTED"||o.status==="CANCELLED");
  const moneyLine=(o.deposit_usd>0)
    ? `<div style="font-size:11px;font-weight:600;margin-top:2px"><span style="color:#15803d">${t("deposit")} ${money(o.deposit_usd)}</span>${(!done&&o.remaining_usd!=null)?` · <span style="color:#b42318">${t("remaining")} ${money(o.remaining_usd)}</span>`:""}</div>`
    : "";
  return `<div class="ord">
    ${it.image?`<img class="thumb" src="${esc(it.image)}" alt="">`:'<div class="thumb"></div>'}
    <div class="t" dir="auto">${esc(it.title||o.order_id)}${more}<div style="color:var(--muted);font-weight:500;font-size:11px">${esc(o.order_id)}${eta}</div>${moneyLine}</div>
    <span class="pill" style="color:${st.c};background:${st.b}">${LANG==="ar"?st.ar:st.en}</span></div>`;
}
function payRow(p){
  const refund=p.kind==="refund";
  const kind=t(refund?"krefund":(p.kind==="collect"?"kcollect":"kdeposit"));
  const ils=(p.currency==="ILS"&&p.amount_entered!=null)?` · ₪${Number(p.amount_entered).toFixed(0)}`:"";
  const where=p.order_code?esc(p.order_code):t("credittag");
  return `<div class="ord" style="background:#fbfaf6">
    <div class="t" dir="auto"><b>${kind}</b><div style="color:var(--muted);font-weight:500;font-size:11px">${fmt(p.paid_at)} · ${where}</div></div>
    <span style="font-size:14px;font-weight:800;white-space:nowrap;color:${refund?"#b42318":"#15803d"}">${refund?"−":""}${money(Math.abs(p.amount_usd||0))}<small style="color:var(--muted);font-weight:600">${ils}</small></span></div>`;
}
async function loadDashboard(){
  let d; try{ d=await (await fetch("/api/customer/orders")).json(); }catch(e){ d=null; }
  if(!d){ backToPhone(); return; }
  paint(); show("s_dash");
  $("t_hello").textContent=`${t("hello")} ${d.name||""} 👋`.trim();
  refreshEmailLine();
  const tot=d.totals||{};
  $("balSum").innerHTML=((tot.deposited_usd||0)>0||(tot.remaining_usd||0)>0||(tot.credit_usd||0)>0)
    ? `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px">
         <div style="flex:1;min-width:130px;background:#dcfce7;border:1px solid #bbf7d0;border-radius:12px;padding:10px 13px">
           <div style="font-size:20px;font-weight:800;color:#15803d">${money(tot.deposited_usd||0)}</div>
           <div style="font-size:11.5px;color:#166534">${t("paidsum")}</div></div>
         <div style="flex:1;min-width:130px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px 13px">
           <div style="font-size:20px;font-weight:800;color:#b42318">${money(tot.remaining_usd||0)}</div>
           <div style="font-size:11.5px;color:#991b1b">${t("remainsum")}</div></div>
         ${(tot.credit_usd||0)>0?`<div style="flex:1;min-width:130px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 13px">
           <div style="font-size:20px;font-weight:800;color:#1d4ed8">${money(tot.credit_usd)}</div>
           <div style="font-size:11.5px;color:#1e40af">${t("creditsum")}</div></div>`:""}
       </div>` : "";
  $("shipments").innerHTML=(d.shipments&&d.shipments.length)?d.shipments.map(shipCard).join(""):`<div class="empty">${t("noship")}</div>`;
  $("orders").innerHTML=(d.orders&&d.orders.length)?d.orders.map(orderRow).join(""):`<div class="empty">${t("noord")}</div>`;
  const pays=d.payments||[];
  $("t_payments").style.display=pays.length?"block":"none";
  $("t_payments").textContent=t("payments");
  $("payments").innerHTML=pays.map(payRow).join("");
}
async function init(){
  setLang("ar");
  let me; try{ me=await (await fetch("/api/customer/me")).json(); }catch(e){ me={}; }
  if(me&&me.logged_in){ loadDashboard(); } else { show("s_phone"); $("phone").focus(); }
}
init();
</script>
