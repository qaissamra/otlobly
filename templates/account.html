<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otlobly — حسابي · My account</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Portal-local styles — build on style.css tokens (--orange, pastels, --card-r, shadows). */
  body{margin:0;min-height:100vh;background:#f6f3ec;color:var(--ink);
    font-family:var(--body),-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.55;padding:0}
  .pagewrap{display:flex;justify-content:center;padding:20px 14px 46px}
  body.hasnav .pagewrap{padding-bottom:130px}   /* room for the floating pill nav */
  .card{width:100%;max-width:560px;background:#fff;border:none;border-radius:var(--card-r);
    box-shadow:var(--shadow-card);padding:22px 18px;height:fit-content}
  .brand{display:flex;align-items:center;gap:10px;justify-content:flex-end}
  .brand h1{font-family:var(--head),sans-serif;font-size:21px;margin:0;font-weight:800;letter-spacing:-.4px}
  .brand .ly{color:var(--orange)}
  .lang{display:flex;gap:6px}
  .lang span{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line);
    border-radius:20px;padding:5px 16px}
  .lang span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* language toggle now lives at the bottom of the ☰ menu (was in the header) */
  .navmenu .menulang{display:flex;justify-content:center;padding:12px 0 6px;margin-top:4px;border-top:1px solid #f4f1ec}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 16px;text-align:start}
  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;text-align:start;font-weight:600}
  input{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;
    background:#fbfaf6;text-align:center;letter-spacing:1px;font-family:inherit}
  input:focus{outline:none;border-color:var(--orange);background:#fff}
  button{width:100%;margin-top:14px;font-size:15px;font-weight:800;color:#fff;background:var(--orange);
    border:0;border-radius:999px;padding:14px;cursor:pointer;font-family:var(--head),sans-serif;
    box-shadow:0 10px 22px rgba(255,90,31,.28);transition:transform .12s ease}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.6}
  .ghost{background:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px;margin-top:6px;box-shadow:none}
  .hint{color:var(--muted);font-size:11.5px;text-align:center;margin-top:8px}
  .err{background:#fef2f2;border:1px solid #f3c9c9;color:#b42318;border-radius:12px;padding:10px 12px;
    font-size:13px;margin-top:12px;text-align:center}
  .dev{background:#fffbe6;border:1px dashed #e6c200;border-radius:12px;padding:8px 12px;font-size:12px;
    margin-top:10px;text-align:center;color:#8a6d00}
  .lhero{border-radius:20px;overflow:hidden;margin:14px 0 4px;aspect-ratio:16/8}
  .lhero img{width:100%;height:100%;object-fit:cover;display:block}
  /* ── dashboard header: greeting + bell ── */
  .hello{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;position:relative}
  .hello b{font-family:var(--head),sans-serif;font-size:19px}
  .hello small{display:block;color:var(--muted);font-size:12px;font-weight:500}
  button.bell{width:42px;height:42px;margin:0;padding:0;border-radius:50%;background:#f4f1ea;color:var(--ink);
    box-shadow:none;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
  .bell .bdot{position:absolute;top:9px;inset-inline-end:10px;width:9px;height:9px;border-radius:50%;
    background:var(--orange);border:2px solid #f4f1ea;display:none}
  .belldrop{display:none;position:absolute;top:50px;inset-inline-end:0;z-index:40;background:#fff;
    border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-soft);padding:12px 14px;
    width:min(300px,84vw);text-align:start}
  .belldrop.open{display:block}
  .belldrop .bh{font-weight:800;font-size:13px;margin-bottom:6px;font-family:var(--head),sans-serif}
  .belldrop .bi{font-size:12.5px;padding:7px 0;border-top:1px solid #f4f1ec}
  .belldrop .bi b{color:var(--orange)}
  .belldrop .bnone{color:var(--muted);font-size:12.5px}
  /* ── quick actions ── */
  .qacts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:2px 0 6px}
  .qa{display:block;border-radius:22px;padding:14px 14px 10px;min-height:126px;position:relative;overflow:hidden;
    color:var(--ink);text-decoration:none;box-shadow:var(--shadow-card)}
  .qa b{font-family:var(--head),sans-serif;font-size:15.5px;line-height:1.25;display:block}
  .qa .qsub{font-size:11px;color:rgba(35,24,10,.55);display:block;margin-top:2px}
  .qa.peach{background:linear-gradient(160deg,var(--peach),var(--peach-2))}
  .qa.lav{background:linear-gradient(160deg,var(--lav-2),var(--lav))}
  .qa .qart{position:absolute;bottom:4px;inset-inline-end:6px;width:76px;height:64px}
  /* ── shipment cards (track-card, portal edition) — cream + Otlobly-orange,
       matching the landing tracking cards. --pa (accent) drives the progress,
       timeline dots and field icons; --pbg is the card background. The old
       .p-lav/.p-sky/.p-mint/.p-peach cycle is collapsed to one brand scheme
       (shipCard() still adds those classes — now harmless no-ops). ── */
  .tcard{--pa:var(--orange);--pbg:linear-gradient(160deg,#fff6ef,#ffe9db);
    border:1px solid #ffe3d1;border-radius:var(--card-r);padding:16px;margin-bottom:14px;
    background:var(--pbg);box-shadow:var(--shadow-card)}
  .tc-top{display:flex;align-items:center;gap:11px}
  .tc-thumb{width:56px;height:56px;flex:none;border-radius:16px;background:#fff;overflow:hidden;
    box-shadow:0 4px 12px rgba(35,24,10,.10);display:flex;align-items:center;justify-content:center}
  .tc-thumb img{width:100%;height:100%;object-fit:contain}
  .tc-thumb svg{width:70%;height:70%}
  .tc-meta{flex:1;min-width:0}
  .tc-meta .nm{font-family:var(--head),sans-serif;font-weight:800;font-size:14.5px;line-height:1.3;
    max-height:2.6em;overflow:hidden}
  .tc-meta .id{font-size:11px;color:rgba(35,24,10,.55);direction:ltr;text-align:start;
    unicode-bidi:embed;margin-top:2px}
  html[dir=rtl] .tc-meta .id{text-align:end}
  .tc-art{width:84px;flex:none;margin-inline-start:auto}
  .tc-art svg{width:100%;height:auto;display:block}
  .tcard .prog{display:flex;align-items:center;margin:18px 2px 6px}
  .tcard .prog .node{width:15px;height:15px;border-radius:50%;flex:none;background:#fff;
    border:3px solid rgba(35,24,10,.15);z-index:1;position:relative}
  .tcard .prog .node.done{background:var(--pa);border-color:var(--pa)}
  .tcard .prog .node.cur{background:#fff;border-color:var(--pa);box-shadow:0 0 0 5px rgba(255,90,31,.18)}
  .tcard .prog .seg{flex:1;height:4px;background:#f0ddcb;border-radius:4px;margin:0 -2px}
  .tcard .prog .seg.fill{background:var(--pa)}
  .tcard .prog-labels{display:flex;font-size:10px;font-weight:600;color:rgba(35,24,10,.6);margin:2px 0 4px}
  .tcard .prog-labels span{flex:1;text-align:center}
  .tcard .prog-labels span:first-child{text-align:start}
  .tcard .prog-labels span:last-child{text-align:end}
  .tc-fields{display:flex;gap:10px;margin-top:12px}
  .tc-fields .f{flex:1;min-width:0}
  .tc-fields .k{display:flex;align-items:center;gap:5px;font-size:10.5px;color:rgba(35,24,10,.55);font-weight:600}
  .tc-fields .k svg{width:13px;height:13px;flex:none}
  .tc-fields .v{font-family:var(--head),sans-serif;font-weight:800;font-size:13.5px;margin-top:2px}
  .tc-stale{font-size:10.5px;color:rgba(35,24,10,.5);margin-top:8px}
  button.detbtn{width:auto;margin:10px 0 0;padding:7px 16px;font-size:12px;background:rgba(255,255,255,.65);
    color:var(--ink);box-shadow:none;font-weight:700}
  .det{display:none;margin-top:12px;background:rgba(255,255,255,.55);border-radius:16px;padding:12px}
  .det.open{display:block}
  .items{display:flex;flex-direction:column;gap:7px;margin:0 0 4px}
  .prod{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .prod img,.prod .ph{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#f0ede4;
    border:1px solid var(--line);flex:none}
  .tl{list-style:none;margin:8px 0 0;padding:0}
  .tl li{position:relative;padding:0 0 13px 18px;margin:0}
  [dir=rtl] .tl li{padding:0 18px 13px 0}
  .tl li::before{content:"";position:absolute;inset-inline-start:4px;top:14px;bottom:-2px;width:2px;background:rgba(35,24,10,.12)}
  .tl li:last-child::before{display:none}
  .tl .dot{position:absolute;inset-inline-start:0;top:3px;width:10px;height:10px;border-radius:50%;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(35,24,10,.15);background:var(--pa)}
  .tl .lab{font-weight:650;font-size:12.5px}
  .tl .when{color:rgba(35,24,10,.5);font-size:11px}
  /* ── money tiles ── */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
  .stat{flex:1;min-width:130px;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-card)}
  .stat .n{font-family:var(--head),sans-serif;font-size:20px;font-weight:800}
  .stat .l{font-size:11.5px;font-weight:600;margin-top:1px}
  .stat.mint{background:linear-gradient(160deg,var(--mint-2),var(--mint))}
  .stat.mint .n,.stat.mint .l{color:#116a49}
  .stat.rose{background:linear-gradient(160deg,#ffe3da,#ffd0c2)}
  .stat.rose .n,.stat.rose .l{color:#b23310}
  .stat.sky{background:linear-gradient(160deg,var(--sky-2),var(--sky))}
  .stat.sky .n,.stat.sky .l{color:#1c4f9e}
  /* ── sections / lists ── */
  h2.sec{font-family:var(--head),sans-serif;font-size:15px;font-weight:800;margin:20px 0 10px;text-align:start}
  .ord{display:flex;align-items:center;gap:10px;border:none;border-radius:18px;
    padding:10px 12px;margin-bottom:9px;background:#faf8f3}
  .ord .thumb{width:44px;height:44px;border-radius:12px;object-fit:contain;background:#fff;
    border:1px solid var(--line);flex:none}
  .ord .t{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.3;max-height:2.6em;overflow:hidden}
  .pill{font-size:10.5px;font-weight:800;border-radius:20px;padding:3px 9px;white-space:nowrap}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px}
  .osearch{display:flex;align-items:center;gap:8px;background:#faf8f3;border:1px solid var(--line);
    border-radius:999px;padding:4px 14px;margin:2px 0 12px}
  .osearch svg{width:17px;height:17px;flex:none;color:var(--muted)}
  .osearch input{border:none;background:none;text-align:start;letter-spacing:0;font-size:14px;padding:9px 2px}
  .osearch input:focus{background:none}
  .foot{margin-top:18px;color:var(--muted);font-size:11.5px;text-align:center}
  /* ── floating bottom pill nav (dashboard only) ── */
  .pillnav{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;
    background:#17130c;border-radius:999px;padding:8px;gap:4px;box-shadow:0 16px 38px rgba(20,14,5,.35)}
  .pillnav.show{display:flex}
  .pillnav button{width:52px;height:52px;margin:0;padding:0;border-radius:50%;background:transparent;
    color:#a49c8e;box-shadow:none;display:flex;align-items:center;justify-content:center;flex:none}
  .pillnav button.on{background:var(--orange);color:#fff}
  /* ── settings ── */
  .setbox{border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 12px;background:#fbfaf6}
  /* ☰ menu (shared pattern across the public pages) — overrides the page's global button style */
  button.burger{width:38px;height:38px;margin:0;margin-inline-end:auto;padding:0;border:none;background:#f0ede8;border-radius:10px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;box-shadow:none}
  .navmenu{display:none;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:#fff;
    padding:4px 12px;margin:12px 0 4px}
  .navmenu.open{display:flex}
  .navmenu a{display:flex;align-items:center;gap:9px;padding:11px 4px;border-bottom:1px solid #f4f1ec;
    color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;text-align:start}
  .navmenu a svg{flex:none;opacity:.75}
  .navmenu a:last-of-type{border-bottom:none}
  .navmenu .wa-menu{background:#25D366;color:#fff;border-radius:999px;justify-content:center;
    margin:8px 0;padding:11px 16px;border-bottom:none}
  .navmenu .wa-menu svg{opacity:1}
  @media (max-width:420px){ .card{padding:18px 14px} .qa .qart{width:66px;height:56px} }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="pagewrap">
<div class="card">

  <!-- STATE 1 (auth v2): Google is THE front door; under it a password login and
       "Create an account". Old passwordless buttons removed from the UI — their
       endpoints stay alive for magic ?vt= links + the ManyChat relay. -->
  <div id="s_phone" style="display:none">
    <div class="lhero"><img src="/static/assets/truck.jpg" alt=""></div>
    <p class="sub" id="t_introphone"></p>
    {% if google_enabled %}
    <button id="b_google" onclick="googleGo()"
            style="width:100%;background:#fff;color:#1a160f;border:1.5px solid var(--line);border-radius:999px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 20px rgba(35,24,10,.08)">
      <svg width="19" height="19" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.9 6.2C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.4 6.9-17.7z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.6l-7.7-6c-2.1 1.4-4.8 2.3-7.5 2.3-6.3 0-11.7-4.1-13.6-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
      <span id="t_googlebtn"></span></button>
    <div style="display:flex;align-items:center;gap:10px;color:#9aa3af;font-size:12px;margin:16px 0 2px">
      <span style="flex:1;height:1px;background:#e5e7eb"></span>أو · or<span style="flex:1;height:1px;background:#e5e7eb"></span></div>
    {% endif %}
    <label id="t_loginid"></label>
    <input id="lid" inputmode="email" placeholder="05xxxxxxxx / name@example.com"
           style="letter-spacing:0" onkeydown="if(event.key==='Enter')pwLogin()">
    <label id="t_loginpw"></label>
    <input id="lpw" type="password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')pwLogin()">
    <button id="b_login" onclick="pwLogin()"></button>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer">
      <input id="remember" type="checkbox" checked style="width:auto;margin:0"><span id="t_remember"></span></label>
    <div id="vlOut"></div>
    <button class="ghost" id="b_mksignup" onclick="openSignup()"
            style="border:1px solid var(--line);border-radius:999px;width:100%;padding:12px;font-size:14px;margin-top:14px"></button>
  </div>

  <!-- STATE 1b (auth v2): create an account — name, phone, optional email, password.
       NOTHING is created server-side until the phone verifies on the next step. -->
  <div id="s_signup" style="display:none">
    <p class="sub" id="t_signhead"></p>
    <label id="t_signname"></label>
    <input id="sname" placeholder="" style="letter-spacing:0"
           onkeydown="if(event.key==='Enter')signupGo()">
    <label id="t_signphone"></label>
    <input id="sphone" type="tel" inputmode="tel" placeholder="05xxxxxxxx"
           onkeydown="if(event.key==='Enter')signupGo()">
    <label id="t_signemail"></label>
    <input id="semail" type="email" inputmode="email" placeholder="name@example.com"
           style="letter-spacing:0" onkeydown="if(event.key==='Enter')signupGo()">
    <label id="t_signpw"></label>
    <input id="spw" type="password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')signupGo()">
    <label id="t_signpw2"></label>
    <input id="spw2" type="password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')signupGo()">
    <button id="b_signup" onclick="signupGo()"></button>
    <button class="ghost" id="b_sback" onclick="show('s_phone')"></button>
    <div id="sOut"></div>
  </div>

  <!-- STATE 2 (auth v2): the shared "verify your phone" step — after Google (skippable,
       with the you-won't-see-your-orders disclaimer) or after a manual signup. -->
  <div id="s_link" style="display:none">
    <p class="sub" id="t_linkhead"></p>
    <div id="linkEntry">
      <label id="t_linkphone"></label>
      <input id="lkphone" type="tel" inputmode="tel" placeholder="05xxxxxxxx"
             onkeydown="if(event.key==='Enter')lkSend()">
      <button id="b_lksend" onclick="lkSend()"></button>
    </div>
    <div id="linkCode" style="display:none">
      <!-- "SMS sent to <number> [Edit]" -->
      <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:11px 13px;font-size:13.5px;margin-top:8px">
        📩 <span id="t_linksent"></span> <b id="lkShown" dir="ltr"></b>
        <button class="ghost" id="b_lkedit" onclick="lkEdit()"
                style="display:inline;width:auto;padding:3px 12px;margin:0 6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px"></button>
      </div>
      <div id="lkKnown" style="display:none;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 13px;font-size:13px;margin-top:8px">
        ℹ️ <span id="t_linknoorders"></span></div>
      <label id="t_linkcode"></label>
      <input id="lkcode" type="tel" inputmode="numeric" maxlength="6" placeholder="● ● ● ● ● ●"
             onkeydown="if(event.key==='Enter')lkVerify()">
      <button id="b_lkverify" onclick="lkVerify()"></button>
    </div>
    <div id="lkOut"></div>
    <div id="linkSkipBox" style="display:none;margin-top:14px">
      <button class="ghost" id="b_lkskip" onclick="lkSkip()"
              style="border:1px solid var(--line);border-radius:999px;width:100%;padding:11px;font-size:13.5px"></button>
      <div class="hint" id="t_linkskipnote" style="margin-top:6px"></div>
    </div>
  </div>

  <!-- STATE 3: dashboard — app-style: greeting+bell, quick actions, shipment cards,
       tabbed sections driven by the floating pill nav. -->
  <div id="s_dash" style="display:none">
    <div class="hello">
      <div><b id="t_hello"></b><small id="t_hellosub"></small></div>
      <button class="bell" id="bell" onclick="bellToggle(event)" aria-label="تنبيهات · notifications">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="bdot" id="bellDot"></span>
      </button>
      <div class="belldrop" id="bellDrop"></div>
    </div>

    <!-- HOME tab -->
    <div id="sec_home">
      <!-- Auth v2: standing disclaimer for phone-less (Google-skip) sessions -->
      <div id="linkbanner" style="display:none;background:#fef2f2;border:1.5px solid #fecaca;border-radius:14px;padding:13px 15px;font-size:13.5px;margin-bottom:12px">
        📵 <span id="t_banner"></span>
        <button id="b_linknow" onclick="openLink('', true)"
                style="width:auto;display:inline-block;margin:8px 0 0;padding:8px 18px;font-size:13px;border-radius:999px"></button>
      </div>
      <div id="balSum"></div>
      <div class="qacts">
        <a class="qa peach" href="/order">
          <b id="t_qorder"></b><span class="qsub" id="t_qordersub"></span>
          <!-- interim brand SVG — swap to a generated 3D PNG when assets are ready -->
          <svg class="qart" viewBox="0 0 96 80" aria-hidden="true">

/* ---- Auth v2 flows: Google front door · password login · create-account ·
   the shared "verify your phone" step (send → sent-to <number> [Edit] → code). ---- */
async function post(url,body){ try{ return await (await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})).json(); }catch(e){ return {error:"network"}; } }
function rememberVal(){ const r=$("remember"); return (!r||r.checked)?1:0; }
function googleGo(){ location.href="/api/customer/google/start?remember="+rememberVal(); }
async function pwLogin(){
  const id=($("lid").value||"").trim(), pw=$("lpw").value||"";
  if(!id||!pw){ $("vlOut").innerHTML=`<div class="err">${t("loginid")} + ${t("loginpw")}</div>`; return; }
  const b=$("b_login"); b.disabled=true; const o=b.textContent; b.textContent=t("sending");
  const d=await post("/api/customer/pwlogin",{identifier:id,password:pw,remember:!!rememberVal()});
  b.disabled=false; b.textContent=o;
  if(!d.ok){ $("vlOut").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  $("vlOut").innerHTML=""; loadDashboard();
}
function openSignup(){ $("sOut").innerHTML=""; paint(); show("s_signup"); $("sname").focus(); }
async function signupGo(){
  const b=$("b_signup"); b.disabled=true; const o=b.textContent; b.textContent=t("sending");
  const d=await post("/api/customer/signup",{name:($("sname").value||"").trim(),
    phone:($("sphone").value||"").trim(), email:($("semail").value||"").trim(),
    password:$("spw").value||"", confirm:$("spw2").value||"", remember:!!rememberVal()});
  b.disabled=false; b.textContent=o;
  if(!d.ok){ $("sOut").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  // Signup parked server-side — nothing exists until the phone verifies.
  openLink($("sphone").value.trim(), false);
}

  b.disabled=false; b.textContent=o;
  if(!d.ok){ $("lkOut").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  $("linkEntry").style.display="none"; $("linkCode").style.display="block";
  $("lkShown").textContent=d.to||p;                       // "SMS sent to <number> [Edit]"
  $("lkKnown").style.display=(d.known===false)?"block":"none";  // no-orders note
  $("lkcode").focus();
  if(d.dev_code){ $("lkOut").innerHTML=`<div class="dev">رمز تجريبي (dev): <b>${d.dev_code}</b></div>`; $("lkcode").value=d.dev_code; }
}
function lkEdit(){ $("linkCode").style.display="none"; $("linkEntry").style.display="block"; $("lkOut").innerHTML=""; $("lkphone").focus(); }
async function lkVerify(){
  const c=($("lkcode").value||"").trim(); if(!c)return;
  const b=$("b_lkverify"); b.disabled=true; const o=b.textContent; b.textContent=t("verifying");
  const d=await post("/api/customer/phone/link/verify",{phone:LKPHONE,code:c});
  b.disabled=false; b.textContent=o;
  if(!d.ok){ $("lkOut").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  loadDashboard();
}
function lkSkip(){ loadDashboard(); }
function backToPhone(){ show("s_phone"); $("lid").focus(); }
async function logout(){ try{ await fetch("/api/customer/logout",{method:"POST"}); }catch(e){} D=null; show("s_phone"); }
async function refreshEmailLine(){
  let me; try{ me=await (await fetch("/api/customer/me")).json(); }catch(e){ me={}; }
  const st=me.email_masked?`${esc(me.email_masked)} ${me.email_verified?"✓":""}`:t("enolink");
  $("emailLine").innerHTML=`✉️ ${st} <a href="#" onclick="toggleEmailMgr();return false" style="color:var(--orange);font-weight:700;text-decoration:none">${me.email_masked?t("echange"):t("elink")}</a>`;
}
function toggleEmailMgr(){
  const m=$("emailMgr"); const open=m.style.display!=="none";
  m.style.display=open?"none":"block";
  if(!open){ MCODE=false; $("mcodeBox").style.display="none"; $("out4").innerHTML=""; paint(); $("memail").focus(); }
}
function linkGo(){ MCODE?linkVerify():linkStart(); }
async function linkStart(){
  const em=($("memail").value||"").trim(); if(!em)return;
  const b=$("b_mgo"); b.disabled=true; const d=await post("/api/customer/email/link/start",{email:em}); b.disabled=false;
  if(!d.ok){ $("out4").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  MCODE=true; $("mcodeBox").style.display="block"; paint(); $("mcode").focus();
  $("out4").innerHTML=`<div class="hint">${t("esent")}</div>`;
  if(d.dev_code){ $("out4").innerHTML+=`<div class="dev">رمز تجريبي (dev): <b>${d.dev_code}</b></div>`; $("mcode").value=d.dev_code; }
}
async function linkVerify(){
  const c=($("mcode").value||"").trim(); if(!c)return;
  const b=$("b_mgo"); b.disabled=true; const d=await post("/api/customer/email/link/verify",{code:c}); b.disabled=false;
  if(!d.ok){ $("out4").innerHTML=`<div class="err">${esc(d.error)||'Error'}</div>`; return; }
  MCODE=false; $("emailMgr").style.display="none"; $("out4").innerHTML="";
  refreshEmailLine();
}
/* ---- dashboard rendering ---------------------------------------------------- */
const PALS=["p-lav","p-sky","p-mint","p-peach"];
// bucket → progress step (1..4). Exact status text still shown in the fields row.
function stepOf(s){
  const b=((s.current||{}).bucket)||""; const hasTrack=!!(s.tracking&&(s.events||[]).length);
  if(b==="delivered") return 5;                 // all four done
  if(b==="arrived")   return 4;
  if(b==="customs"||b==="cleared") return 3;
  if(b==="transit")   return hasTrack?2:( (s.est_delivery)?2:1 );
  return 1;
}
const BOX_SVG=`<svg viewBox="0 0 96 96" aria-hidden="true"><polygon points="48,20 78,34 48,48 18,34" fill="#f3cba0"/><polygon points="18,34 48,48 48,80 18,64" fill="#e2ab74"/><polygon points="78,34 48,48 48,80 78,64" fill="#d29a62"/><polygon points="44.8,21.5 51.2,24.5 51.2,46.5 44.8,43.5" fill="#ff5a1f"/></svg>`;
const RIDE_SVG=`<svg viewBox="0 0 96 84" aria-hidden="true"><ellipse cx="48" cy="76" rx="34" ry="5" fill="rgba(35,24,10,.12)"/><rect x="8" y="34" width="30" height="26" rx="6" fill="#ff5a1f"/><rect x="14" y="26" width="18" height="12" rx="3" fill="#e2ab74"/><rect x="21" y="26" width="4" height="12" fill="#ffd7c2"/><path d="M38 42h14a5 5 0 0 1 4 2l7 9a5 5 0 0 1 1 3v4a4 4 0 0 1-4 4H38Z" fill="#ff7a3f"/><rect x="42" y="46" width="11" height="8" rx="2" fill="#fff"/><circle cx="22" cy="66" r="8" fill="#241d15"/><circle cx="22" cy="66" r="3.2" fill="#fff"/><circle cx="54" cy="66" r="8" fill="#241d15"/><circle cx="54" cy="66" r="3.2" fill="#fff"/><path d="M70 62c4-14 12-16 18-16" stroke="#c9c0b2" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/></svg>`;
function shipCard(s,i){
  const cur=s.current||{}; const pal=PALS[i%PALS.length];
  const first=(s.items||[])[0]||{};
  const more=(s.items||[]).length>1?` <span style="font-weight:600;font-size:11px">+${s.items.length-1}</span>`:"";
  const step=stepOf(s);
  const nodes=[1,2,3,4].map(n=>{
    const cls=(step===5||n<step)?"done":(n===step?"cur":"");
    const seg=n<4?`<span class="seg ${ (step===5||n<step)?"fill":"" }"></span>`:"";
    return `<span class="node ${cls}"></span>${seg}`;
  }).join("");
  const eta=(s.est_from&&s.est_to)?fmtRange(s.est_from,s.est_to):(s.est_delivery?fmt(s.est_delivery):"—");
  const items=(s.items||[]).map(it=>`<div class="prod">${it.image?`<img src="${esc(it.image)}" loading="lazy" alt="">`:'<div class="ph"></div>'}<span dir="auto">${esc(it.title)}</span></div>`).join("");
  const evs=(s.events||[]).slice().reverse();
  const tl=evs.length?`<ul class="tl">${evs.map(e=>`<li><span class="dot"></span><div class="lab" dir="auto">${esc(e.label)}</div><div class="when">${fmt(e.date)}</div></li>`).join("")}</ul>`:"";
  const det=(items||tl)?`<button class="detbtn" onclick="toggleDet(this)">${t("details")}</button>
    <div class="det">${items?`<div class="items">${items}</div>`:""}${tl}</div>`:"";
  const asof=(s.stale&&s.as_of)?`<div class="tc-stale">${t("asof")} ${fmt(s.as_of)}</div>`:"";
  return `<div class="tcard ${pal}">
    <div class="tc-top">
      <div class="tc-thumb">${first.image?`<img src="${esc(first.image)}" loading="lazy" alt="">`:BOX_SVG}</div>
      <div class="tc-meta">
        <div class="nm" dir="auto">${esc(first.title)||t("prep")}${more}</div>
        ${s.tracking?`<div class="id">${esc(s.tracking)}</div>`:""}
      </div>
      <div class="tc-art">${RIDE_SVG}</div>
    </div>
    <div class="prog" aria-hidden="true">${nodes}</div>
    <div class="prog-labels"><span>${t("s1")}</span><span>${t("s2")}</span><span>${t("s3")}</span><span>${t("s4")}</span></div>
    <div class="tc-fields">
      <div class="f"><div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>${t("curr")}</span></div>
        <div class="v" dir="auto">${esc(cur.label)||t("prep")}</div></div>
      <div class="f"><div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>${t("etalbl")}</span></div>
        <div class="v">${eta}</div></div>
    </div>
    ${asof}${det}</div>`;
}
function toggleDet(btn){
  const d=btn.nextElementSibling; const open=d.classList.toggle("open");
  btn.textContent=open?t("detailsh"):t("details");
}
function orderRow(o){
  // Unknown/internal statuses must NEVER leak raw to the customer — generic "preparing".
  const st=STAT[o.status]||{ar:"قيد التجهيز",en:"In progress",c:"#92400e",b:"#fef3c7"};
  const it=(o.items||[])[0]||{};
  const more=(o.items||[]).length>1?` +${o.items.length-1}`:"";
  const eta=o.est_delivery?` · ${t("etalbl")} ${fmt(o.est_delivery)}`:"";
  const done=(o.status==="COLLECTED"||o.status==="CANCELLED");
  const moneyLine=(o.deposit_usd>0)
    ? `<div style="font-size:11px;font-weight:600;margin-top:2px"><span style="color:#15803d">${t("deposit")} ${money(o.deposit_usd)}</span>${(!done&&o.remaining_usd!=null)?` · <span style="color:#b42318">${t("remaining")} ${money(o.remaining_usd)}</span>`:""}</div>`
    : "";
  return `<div class="ord">
    ${it.image?`<img class="thumb" src="${esc(it.image)}" alt="">`:'<div class="thumb"></div>'}
    <div class="t" dir="auto">${esc(it.title||o.order_id)}${more}<div style="color:var(--muted);font-weight:500;font-size:11px">${esc(o.order_id)}${eta}</div>${moneyLine}</div>
    <span class="pill" style="color:${st.c};background:${st.b}">${LANG==="ar"?st.ar:st.en}</span></div>`;
}
function payRow(p){
  const refund=p.kind==="refund";
  const kind=t(refund?"krefund":(p.kind==="collect"?"kcollect":"kdeposit"));
  const ils=(p.currency==="ILS"&&p.amount_entered!=null)?` · ₪${Number(p.amount_entered).toFixed(0)}`:"";
  const where=p.order_code?esc(p.order_code):t("credittag");
  return `<div class="ord">
    <div class="t" dir="auto"><b>${kind}</b><div style="color:var(--muted);font-weight:500;font-size:11px">${fmt(p.paid_at)} · ${where}</div></div>
    <span style="font-size:14px;font-weight:800;white-space:nowrap;color:${refund?"#b42318":"#15803d"}">${refund?"−":""}${money(Math.abs(p.amount_usd||0))}<small style="color:var(--muted);font-weight:600">${ils}</small></span></div>`;
}
function renderOrders(){
  const q=($("osearch").value||"").trim().toLowerCase();
  let list=(D&&D.orders)||[];
  if(q) list=list.filter(o=>((o.items||[]).some(it=>(it.title||"").toLowerCase().includes(q)))
                            ||((o.order_id||"").toLowerCase().includes(q)));
  $("orders").innerHTML=list.length?list.map(orderRow).join(""):`<div class="empty">${t("noord")}</div>`;
}
function renderLists(){
  if(!D) return;
  const tot=D.totals||{};
  $("balSum").innerHTML=((tot.deposited_usd||0)>0||(tot.remaining_usd||0)>0||(tot.credit_usd||0)>0)
    ? `<div class="stats">
         <div class="stat mint"><div class="n">${money(tot.deposited_usd||0)}</div><div class="l">${t("paidsum")}</div></div>
         <div class="stat rose"><div class="n">${money(tot.remaining_usd||0)}</div><div class="l">${t("remainsum")}</div></div>
         ${(tot.credit_usd||0)>0?`<div class="stat sky"><div class="n">${money(tot.credit_usd)}</div><div class="l">${t("creditsum")}</div></div>`:""}
       </div>` : "";
  $("shipments").innerHTML=(D.shipments&&D.shipments.length)
    ? D.shipments.map(shipCard).join("") : `<div class="empty">${t("noship")}</div>`;
  renderOrders();
  const pays=D.payments||[];
  $("t_payments").textContent=t("payments");
  $("payments").innerHTML=pays.length?pays.map(payRow).join(""):`<div class="empty">—</div>`;
  $("nb_pay").style.display=pays.length?"flex":"none";
  if(TAB==="pay"&&!pays.length) switchTab("home");
}
/* ---- notification bell: diff shipment statuses vs the last visit (localStorage) ---- */
let BELL_CHANGES=[], BELL_CUR={};
function bellCheck(){
  let snap={}; try{ snap=JSON.parse(localStorage.getItem("otl_ship_snap")||"{}"); }catch(e){}
  BELL_CUR={}; BELL_CHANGES=[];
  (D.shipments||[]).forEach(s=>{ const k=s.tracking||"?"; const lab=(s.current||{}).label||"";
    BELL_CUR[k]=lab;
    if(Object.prototype.hasOwnProperty.call(snap,k) && snap[k]!==lab) BELL_CHANGES.push({k,lab}); });
  if(!localStorage.getItem("otl_ship_snap"))            // first visit — just remember, no dot
    localStorage.setItem("otl_ship_snap",JSON.stringify(BELL_CUR));
  $("bellDot").style.display=BELL_CHANGES.length?"block":"none";
}
function bellToggle(e){ if(e) e.stopPropagation();
  const d=$("bellDrop"); const open=d.classList.toggle("open"); if(!open) return;
  d.innerHTML=`<div class="bh">🔔 ${t("bellhead")}</div>`+(BELL_CHANGES.length
    ? BELL_CHANGES.map(c=>`<div class="bi"><span dir="ltr">${esc(c.k)}</span> ← <b dir="auto">${esc(c.lab)}</b></div>`).join("")
    : `<div class="bnone">${t("bellnone")}</div>`);
  localStorage.setItem("otl_ship_snap",JSON.stringify(BELL_CUR));   // seen → clear the dot
  BELL_CHANGES=[]; $("bellDot").style.display="none";
}
async function loadDashboard(){
  let d; try{ d=await (await fetch("/api/customer/orders")).json(); }catch(e){ d=null; }
  if(!d){ backToPhone(); return; }
  D=d; paint(); show("s_dash"); switchTab(TAB==="pay"&&!(d.payments||[]).length?"home":TAB);
  // Auth v2: phone-less (Google-skip) session → the standing "not connected" banner.
  $("linkbanner").style.display=(d.phone_linked===false)?"block":"none";
  $("t_hello").textContent=`${t("hello")} ${d.name||""} 👋`.trim();
  refreshEmailLine();
  renderLists();
  bellCheck();
}
async function init(){
  setLang("ar");
  // ?vt= — one-time login token from the WhatsApp "Verify account" button or the
  // email magic link. Strip it from the URL/history first, then redeem via POST.
  const qs=new URLSearchParams(location.search);
  const vt=qs.get("vt");
  // ?gerr= — a failed "Sign in with Google" round-trip (fail/state).
  const gerr=qs.get("gerr");
  // ?link=phone — fresh Google login with no linked phone → the verify-phone step.
  const lk=qs.get("link");
  if(gerr||lk) history.replaceState(null,"",location.pathname);
  let vtErr="";
  if(vt){
    history.replaceState(null,"",location.pathname);
    const d=await post("/api/customer/magic/verify",{token:vt});
    if(d&&d.ok){ loadDashboard(); return; }
    vtErr=(d&&d.error)||"";
  }
  let me; try{ me=await (await fetch("/api/customer/me")).json(); }catch(e){ me={}; }
  if(me&&me.logged_in){
    if(me.phone_linked===false&&(lk==="phone"||me.pending_phone)){
      openLink(me.pending_phone||"", !me.pending_phone);   // signup=required, google=skippable
    } else loadDashboard();
  }
  else { show("s_phone");
    if(vtErr)$("vlOut").innerHTML=`<div class="err">${esc(vtErr)}</div>`;
    else if(gerr)$("vlOut").innerHTML=`<div class="err">${esc(t("gerrfail"))}</div>`;
    $("lid").focus(); }
}
init();
</script>
