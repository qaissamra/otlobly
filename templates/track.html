<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otlobly — تتبع طلبك</title>
<style>
  :root{--bg:#f7f5ef;--ink:#15140f;--muted:#7a766c;--line:#e8e4d8;--accent:#ff5a1f;--card:#fff;--good:#16a34a;--bad:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;padding:28px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;
    width:420px;max-width:100%;box-shadow:0 8px 30px rgba(30,25,10,.07)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand h1{font-size:19px;margin:0;font-weight:800}.brand .ly{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:12px 0 4px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  button{width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:var(--accent);
    color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .err{background:#fef2f2;color:var(--bad);border:1px solid #f3c0c0;border-radius:9px;padding:9px 12px;font-size:13px;margin-top:12px}
  .result{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;direction:rtl;text-align:right}
  .result h2{font-size:16px;margin:0 0 4px}
  .amt{color:var(--accent);font-weight:800}
  .tl{list-style:none;padding:0;margin:14px 0 0}
  .tl li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;color:var(--muted)}
  .tl li.done{color:var(--ink);font-weight:600}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
  .tl li.done .dot{background:var(--good);border-color:var(--good)}
  .cancel{color:var(--bad);font-weight:700}
</style>
<div class="card">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 100 100"><rect width="100" height="100" rx="26" fill="#111"/>
      <circle cx="46" cy="52" r="20" fill="none" stroke="#fff" stroke-width="9"/>
      <circle cx="46" cy="52" r="6" fill="#fff"/><circle cx="72" cy="30" r="9" fill="#ff5a1f"/></svg>
    <h1>Otlob<span class="ly">ly</span></h1>
  </div>
  <p class="sub">تتبّع طلبك · أدخل رقم الطلب ورقم الواتساب</p>
  <label>Order ID · رقم الطلب</label>
  <input id="oid" placeholder="OTL-0001" autofocus>
  <label>WhatsApp · رقم الواتساب</label>
  <input id="phone" placeholder="0599…">
  <button onclick="track()">تتبّع · Track</button>
  <div id="out"></div>
</div>
<script>
const $=id=>document.getElementById(id);
async function track(){
  $("out").innerHTML="";
  const r=await fetch("/api/track",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({order_id:$("oid").value,phone:$("phone").value})});
  const d=await r.json();
  if(d.error){$("out").innerHTML=`<div class="err">${d.error}</div>`;return;}
  const amt=d.amount_to_collect_usd!=null?`$${d.amount_to_collect_usd.toFixed(2)}`:'—';
  const tracking=d.tracking_number?`<div>رقم الشحنة: <b>${d.tracking_number}</b></div>`:'';
  const eta=d.est_delivery_customer?`<div class="eta">🚚 موعد التوصيل المتوقع: <b>${d.est_delivery_customer}</b></div>`:'';
  const tl=d.cancelled?`<div class="cancel">❌ تم إلغاء الطلب</div>`
    :`<ul class="tl">${d.timeline.map(s=>`<li class="${s.done?'done':''}"><span class="dot"></span>${s.ar}</li>`).join("")}</ul>`;
  $("out").innerHTML=`<div class="result"><h2>${d.order_id}</h2>
    <div>المبلغ المطلوب: <span class="amt">${amt}</span></div>${eta}${tracking}${tl}</div>`;
}
</script>
