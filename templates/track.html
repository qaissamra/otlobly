<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otlobly — تتبّع شحنتك · Track your package</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#111111">
<style>
  :root{--bg:#f7f5ef;--ink:#15140f;--muted:#7a766c;--line:#e8e4d8;--accent:#ff5a1f;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;padding:28px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;
    width:440px;max-width:100%;box-shadow:0 8px 30px rgba(30,25,10,.07)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .brand h1{font-size:19px;margin:0;font-weight:800}.brand .ly{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;
    text-align:center;font-weight:700;letter-spacing:1px}
  button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:10px;background:var(--accent);
    color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6}
  .err{background:#fef2f2;color:#b91c1c;border:1px solid #f3c0c0;border-radius:9px;padding:11px 12px;font-size:13.5px;margin-top:14px;text-align:center}
  .result{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .now{display:flex;align-items:center;gap:12px;background:#fafaf7;border:1px solid var(--line);border-radius:12px;padding:14px}
  .now .big{font-size:18px;font-weight:800}
  .now small{color:var(--muted);display:block;font-weight:500;font-size:12px}
  .tnum{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 0}
  .eta{margin-top:10px;background:#ecfdf5;border:1px solid #86efac;color:#15803d;border-radius:10px;padding:9px 12px;font-size:13.5px;text-align:center}
  .tl{list-style:none;padding:0;margin:18px 0 0;position:relative}
  .tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl li{display:flex;gap:14px;padding:9px 0;position:relative}
  .tl .dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);background:#fff;flex:none;z-index:1}
  .tl .body .lab{font-weight:700;font-size:14.5px}
  .tl .body .when{color:var(--muted);font-size:12px}
  .tl li.cur .lab{color:var(--accent)}
  .b-transit .dot{border-color:#3b82f6}.b-arrived .dot{border-color:#3b82f6;background:#3b82f6}
  .b-customs .dot{border-color:#d97706;background:#fff7ed}.b-cleared .dot{border-color:#16a34a;background:#ecfdf5}
  .b-delivered .dot{border-color:#16a34a;background:#16a34a}
  .hint{color:var(--muted);font-size:11.5px;text-align:center;margin-top:8px}
  .foot{margin-top:16px;color:var(--muted);font-size:11.5px;text-align:center}
  .multi{font-weight:800;font-size:14px;margin-bottom:12px}
  .ship + .ship{margin-top:18px;border-top:1px dashed var(--line);padding-top:18px}
  .items{margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
  .prod{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink)}
  .prod img,.prod .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f1efe8;border:1px solid var(--line);flex:none}
</style>
<div class="card">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 100 100"><rect width="100" height="100" rx="26" fill="#111"/>
      <circle cx="46" cy="52" r="20" fill="none" stroke="#fff" stroke-width="9"/>
      <circle cx="46" cy="52" r="6" fill="#fff"/><circle cx="72" cy="30" r="9" fill="#ff5a1f"/></svg>
    <h1>Otlob<span class="ly">ly</span></h1>
  </div>
  <p class="sub">تتبّع شحنتك · Track your package</p>
  <label>رقم الجوال كاملاً · Full mobile number</label>
  <input id="t" type="tel" inputmode="tel" placeholder="05xxxxxxxx" autofocus
         onkeydown="if(event.key==='Enter')track()">
  <button id="btn" onclick="track()">تتبّع شحنتي · Track</button>
  <div class="hint">أدخل رقم جوالك كاملاً · enter your complete mobile number</div>
  <div id="out"></div>
  <div class="foot"><a href="/account" style="color:var(--accent);font-weight:700;text-decoration:none">🔑 حسابي · My account</a></div>
  <div class="foot">Otlobly · لأي استفسار تواصل معنا · contact us anytime</div>
</div>
<script>
const $=id=>document.getElementById(id);
function fmt(s){ if(!s) return ""; const d=new Date(s); if(isNaN(d)) return s;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+
    ' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function fmtRange(a,b){ const f=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  return f(a)+' – '+f(b)+' '+new Date(b).getFullYear(); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shipmentCard(s){
  const cur=s.current||{};
  const items=(s.items||[]).length?`<div class="items">${s.items.map(it=>{
      const t=(typeof it==='string')?it:(it.title||''); const img=(typeof it==='object')?it.image:null;
      return `<div class="prod">${img?`<img src="${esc(img)}" loading="lazy" alt="">`:'<div class="ph"></div>'}<span dir="auto">${esc(t)}</span></div>`;
    }).join("")}</div>`:'';
  const tnum=s.tracking?`<div class="tnum">رقم التتبّع · ${esc(s.tracking)}</div>`:'';
  const eta=(s.est_from&&s.est_to)
    ?`<div class="eta">🚚 الوصول المتوقّع · Expected arrival: <b>${fmtRange(s.est_from,s.est_to)}</b></div>`
    :(s.est_delivery?`<div class="eta">🚚 الوصول المتوقّع · Expected arrival: <b>${fmt(s.est_delivery).split(' · ')[0]}</b></div>`:'');
  const now=`<div class="now b-${cur.bucket||'transit'}"><span class="dot"></span>
      <div><div class="big" dir="auto">${esc(cur.label)||'قيد الشحن'}</div><small>الحالة الحالية · current status</small></div></div>`;
  const asof=(s.stale&&s.as_of)?`<div class="hint">🕓 آخر تحديث · last updated ${fmt(s.as_of)}</div>`:'';
  const evs=(s.events||[]).slice().reverse();
  const tl=evs.length?`<ul class="tl">${evs.map((e,i)=>`<li class="b-${e.bucket||'transit'} ${i===0?'cur':''}">
      <span class="dot"></span><div class="body"><div class="lab" dir="auto">${esc(e.label)}</div>
      <div class="when">${fmt(e.date)}</div></div></li>`).join("")}</ul>`:'';
  return `<div class="ship">${now}${asof}${items}${tnum}${eta}${tl}</div>`;
}
async function track(){
  const q=$("t").value.trim(); if(!q) return;
  const btn=$("btn"); btn.disabled=true; const old=btn.textContent; btn.textContent="…";
  $("out").innerHTML="";
  let d; try{ d=await (await fetch("/api/track",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query:q})})).json(); }catch(e){ d={error:"Network error — try again."}; }
  btn.disabled=false; btn.textContent=old;
  if(!d.found || d.error){ $("out").innerHTML=`<div class="err">${esc(d.error)||'Not found'}</div>`; return; }
  const head=(d.count>1)?`<div class="multi">وجدنا ${d.count} شحنات · ${d.count} shipments</div>`:'';
  $("out").innerHTML=`<div class="result">${head}${(d.shipments||[]).map(shipmentCard).join("")}</div>`;
}
// auto-track when opened via a shared link /track?t=OTL123456 or ?q=…
const _p=new URLSearchParams(location.search); const _q=_p.get('t')||_p.get('q');
if(_q){ $("t").value=_q.trim(); track(); }
</script>
