# Render Blueprint — deploys the hosted Otlobly staff app: a public HTTPS URL,
# employee logins (Admin / Sales / Fulfillment), and a PERSISTENT disk so orders,
# customers, users, and uploads survive restarts and redeploys.
#
# When you connect this GitHub repo to Render, it reads this file automatically.
# Secrets marked `sync: false` are NOT stored here — Render prompts you to type
# them into its dashboard (so passwords/tokens never live in the repo).
services:
  - type: web
    name: otlobly
    runtime: python
    plan: starter                 # ~$7/mo: always-on + required to attach a disk
    region: frankfurt             # closest to Palestine/Israel; change if you like
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --timeout 120 --graceful-timeout 30 --max-requests 400 --max-requests-jitter 100
    healthCheckPath: /healthz
    autoDeploy: true
    # Custom domain (registrar: GoDaddy). Render issues TLS automatically once DNS points here:
    #   A     @    216.24.57.1            (Render's apex IP — replace GoDaddy's "Parked" A record)
    #   CNAME www  otlobly.onrender.com
    # Leave the verfication.otlobly.co records (Resend email) untouched.
    domains:
      - otlobly.co
      - www.otlobly.co
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OTLOBLY_SECRET        # session-cookie signing key — Render generates it
        generateValue: true
      - key: OTLOBLY_SECURE        # force HTTPS-only login cookies (Render is HTTPS)
        value: "1"
      - key: OTLOBLY_DATA_DIR      # all writable data lives on the disk below
        value: /var/data
      - key: OTLOBLY_WORKER_TOKEN  # the Mac order-placer uses this to authenticate
        generateValue: true
      - key: SARA_BRIDGE_TOKEN     # sara-tool uses this to create order drafts (must match sara-tool's value)
        sync: false
      # ── Optional integrations: fill these in Render's dashboard if you use them ──
      - key: CLICKUP_API_TOKEN     # needed for ClickUp sync + P&L cost
        sync: false
      - key: LELUXE_SOURCE_LIST_ID # AZ (2) source list (non-secret) — lets the Goal
        value: "901520351506"      # auto-heal date-backfill run even if config.json lacks it

      - key: SERPAPI_KEY           # optional: price estimates
        sync: false
      - key: SERPAPI_KEY_2
        sync: false
      - key: SERPAPI_KEY_3
        sync: false
      - key: META_AD_ACCOUNT_ID    # optional: P&L ad spend
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: PARCELSAPP_API_KEY    # optional: tier-2 tracking fallback when GAASH is down
        sync: false
      # ── Meta Leads page (Messenger/IG DMs + lead-ad forms) ──
      - key: META_PAGE_ID          # the Facebook Page id (e.g. 868855596307697)
        sync: false
      - key: META_PAGE_TOKEN       # page token: pages_messaging + instagram_manage_messages + leads_retrieval
        sync: false
      # ── Customer-login WhatsApp OTP. NEVER set OTLOBLY_OTP_DEV=1 in production:  ──
      # ── when a WhatsApp send fails it would show login codes/links ON SCREEN to  ──
      # ── anyone typing a customer's phone. Login runs on the wa.me tap (ManyChat) ──
      # ── + email; phone-code activates once the WHATSAPP_* template is approved.  ──
      - key: OTLOBLY_OTP_DEV       # local testing only — leave "0" here
        value: "0"
      # ── Owner Telegram alerts (GAASH deadline countdown + overdue arrivals).     ──
      # ── Optional: the owner can paste both into Settings → Telegram alerts too.  ──
      - key: TELEGRAM_BOT_TOKEN    # @BotFather token for the otlobly alerts bot
        sync: false
      - key: TELEGRAM_CHAT_ID      # the owner's chat (Settings → Detect chat id)
        sync: false
      - key: WHATSAPP_TOKEN        # permanent token for the WhatsApp Business number
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE # approved authentication template name
        sync: false
      # ── Customer email login (second method). Email sign-in stays politely OFF     ──
      # ── ("couldn't send the code") until RESEND_API_KEY is set; WhatsApp login is  ──
      # ── unaffected. NEVER set OTLOBLY_EMAIL_DEV=1 in production: it would show     ──
      # ── login codes ON SCREEN to anyone who types a customer's email address.      ──
      - key: OTLOBLY_EMAIL_DEV     # local testing only — leave "0" here
        value: "0"
      - key: RESEND_API_KEY        # resend.com API key (HTTPS send — no SMTP on Render)
        sync: false
      - key: EMAIL_FROM            # e.g. 'Otlobly <login@otlobly.com>' once the domain is verified
        sync: false
      # ── Branded links: customer links (login magic links, quote links) use the
      # ── custom domain even when generated from the onrender.com host or a
      # ── webhook call. Only safe while https://otlobly.co serves a valid cert.
      - key: PORTAL_BASE_URL
        value: https://otlobly.co
    disk:
      name: otlobly-data
      mountPath: /var/data
      sizeGB: 1
